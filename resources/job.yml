resources:
  jobs:
    airline_job:
      name: ${bundle.target}-${var.student_name}-airline-job
      parameters:
        - name: environment
          default: ${bundle.target}
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${resources.schemas.project_schema.name}
        - name: row_count_threshold
          default: ${var.row_count_threshold}
      email_notifications:
        on_success:
          - ${var.notification_email}
        on_failure:
          - ${var.notification_email}
        no_alert_for_skipped_runs: false
      tasks:
        - task_key: run_airline_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.airline_pipeline.id}
            full_refresh: false

        - task_key: validate_gold
          depends_on:
            - task_key: run_airline_pipeline
          notebook_task:
            notebook_path: ../src/validate_gold.py
            base_parameters:
              environment: "{{job.parameters.environment}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: gold_has_rows
          depends_on:
            - task_key: validate_gold
          condition_task:
            op: GREATER_THAN_OR_EQUAL
            left: "{{tasks.validate_gold.values.gold_row_count}}"
            right: "{{job.parameters.row_count_threshold}}"

        - task_key: publish_ready
          depends_on:
            - task_key: gold_has_rows
              outcome: "true"
          notebook_task:
            notebook_path: ../src/publish_summary.py
            base_parameters:
              environment: "{{job.parameters.environment}}"
              validation_status: ready

        - task_key: publish_blocked
          depends_on:
            - task_key: gold_has_rows
              outcome: "false"
          notebook_task:
            notebook_path: ../src/publish_summary.py
            base_parameters:
              environment: "{{job.parameters.environment}}"
              validation_status: blocked

        - task_key: summarize_layers
          depends_on:
            - task_key: publish_ready
          for_each_task:
            inputs: '["bronze_flights", "silver_flights", "gold_airline_monthly"]'
            concurrency: 3
            task:
              task_key: summarize_layer
              notebook_task:
                notebook_path: ../src/summarize_layer.py
                base_parameters:
                  catalog: "{{job.parameters.catalog}}"
                  schema: "{{job.parameters.schema}}"
                  table_name: "{{input}}"

      tags:
        project: governed-airline-performance
        student: ${var.student_name}
        environment: ${bundle.target}
