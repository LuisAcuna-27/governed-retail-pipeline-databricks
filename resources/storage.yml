resources:
  schemas:
    project_schema:
      name: ${var.schema}
      catalog_name: ${var.catalog}
      comment: Governed retail order analytics objects for ${bundle.target}.

  volumes:
    product_cdc_volume:
      name: product_cdc
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.project_schema.name}
      volume_type: MANAGED
      comment: Student-generated product portfolio CDC files used by Auto Loader and AUTO CDC.
